services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pigplayer-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5000
      - DATA_ROOT=/app/data
      - SQLITE_PATH=/app/data/soundify.db
      - JWT_SECRET=pigplayer-production-jwt-secret-replace-me-offline-2026
      - JWT_REFRESH_SECRET=pigplayer-production-refresh-secret-replace-me-offline-2026
    volumes:
      # Persists SQLite database and audio/artwork library
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pigplayer-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pigplayer-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_INTERNAL_URL=http://backend:5000
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pigplayer-net

networks:
  pigplayer-net:
    driver: bridge

