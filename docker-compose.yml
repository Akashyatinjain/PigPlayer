services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pigplayer-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - DATA_ROOT=/app/data
      - SQLITE_PATH=/app/data/soundify.db
      - DATABASE_PROVIDER=${DATABASE_PROVIDER:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-}
      - DIRECT_URL=${DIRECT_URL:-}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      - LOCAL_USER_EMAIL=${LOCAL_USER_EMAIL:-}
      - LOCAL_USER_PASSWORD=${LOCAL_USER_PASSWORD:-}
      - LOCAL_USER_NAME=${LOCAL_USER_NAME:-Local User}
    volumes:
      # Persists SQLite database and audio/artwork library
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pigplayer-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pigplayer-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_INTERNAL_URL=http://backend:5000
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pigplayer-net

networks:
  pigplayer-net:
    driver: bridge

