<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
    <defs>
      <linearGradient id="grad_QUANTUMHORIZONS" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1d4ed8" />
        <stop offset="100%" stop-color="#4f46e5" />
      </linearGradient>
      <radialGradient id="rad_QUANTUMHORIZONS" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4" />
        <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
      </radialGradient>
    </defs>
    
    <rect width="500" height="500" fill="#0b0e18" />
    
    <!-- Vinyl grooves texture -->
    <circle cx="250" cy="250" r="220" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
    <circle cx="250" cy="250" r="180" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5" />
    <circle cx="250" cy="250" r="140" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="250" cy="250" r="100" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

    <!-- Ambient glow circle in Cobalt -->
    <circle cx="250" cy="250" r="200" fill="url(#rad_QUANTUMHORIZONS)" />

    <!-- Cobalt core circle -->
    <circle cx="250" cy="250" r="70" fill="url(#grad_QUANTUMHORIZONS)" />
    <circle cx="250" cy="250" r="20" fill="#0b0e18" />
    <circle cx="250" cy="250" r="4" fill="#818cf8" />

    <!-- Sleek typography -->
    <text x="40" y="60" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="3">CYBERPUNK</text>
    <text x="40" y="420" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="1.5">QUANTUM HORIZONS</text>
    <text x="40" y="450" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="15" font-weight="500">Apex Echo</text>
    <text x="460" y="60" text-anchor="end" fill="#3b82f6" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">COBALT HI-FI</text>
  </svg>